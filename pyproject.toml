[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-agent-lab"
version = "0.1.0"
description = "Learning AI orchestration through OSB to MuleSoft migration"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0.0,<3",
  "pydantic>=2.8,<3",
]

[tool.setuptools.packages.find]
include = ["orchestrator*"]
